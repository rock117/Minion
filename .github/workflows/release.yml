name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "（可选）要发布的 tag，填 v0.1.0 这类已存在的 tag；留空则只构建安装包"
        required: false
        type: string

permissions:
  contents: write

# 分支构建：同一分支的新 push 取消旧构建；tag 发布不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
            bundles: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
            bundles: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 只有发布（tag / 手动指定 tag）时才校验版本号；普通 push 按仓库里的版本构建
      - name: Verify versions match tag
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          if [[ ! "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是合法版本号，请使用 v1.2.3 格式"
            exit 1
          fi

          actual_conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          actual_pkg=$(node -p "require('./package.json').version")
          actual_cargo=$(sed -n '/^\[package\]/,/^\[/p' src-tauri/Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)

          if [ "$actual_conf" != "$expected" ] \
            || [ "$actual_pkg" != "$expected" ] \
            || [ "$actual_cargo" != "$expected" ]; then
            echo "::error::版本号与 tag $tag 不一致"
            echo "  src-tauri/tauri.conf.json : $actual_conf"
            echo "  package.json              : $actual_pkg"
            echo "  src-tauri/Cargo.toml      : $actual_cargo"
            echo "修复: node scripts/set-version.mjs $expected"
            echo "      git commit -am \"chore: bump version to $expected\""
            echo "      git tag -f $tag && git push -f origin $tag"
            exit 1
          fi
          echo "版本校验通过: $expected"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's|  \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Minion ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            自动构建的安装包（未做代码签名）：

            | 平台 | 文件 | 安装说明 |
            | --- | --- | --- |
            | Windows | `minion_*_x64-setup.exe` / `.msi` | 出现 SmartScreen 提示时选「更多信息 → 仍要运行」 |
            | macOS (Apple Silicon) | `minion_*_aarch64.dmg` | 首次打开需在 Finder 中右键 → 打开 |
            | macOS (Intel) | `minion_*_x64.dmg` | 同上 |
            | Linux | `.AppImage` / `.deb` / `.rpm` | AppImage 需先 `chmod +x` |

            校验和见 `SHA256SUMS.txt`。
          files: artifacts/**/*
